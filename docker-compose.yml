version: "3.9"

services:
  #  API Server 
  api:
    build:
      context: .
      target: development
    ports:
      - "8000:8000"
    env_file:
      - backend/.env
    volumes:
      - .:/app
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - backend
    restart: unless-stopped

  #  Celery Worker 
  worker:
    build:
      context: .
      target: development
    command: >
      celery -A app.workers.tasks.celery_app worker
      --loglevel=info
      --queues=email,media,notifications,maintenance
      --concurrency=4
    env_file:
      - backend/.env
    volumes:
      - .:/app
    depends_on:
      - redis
      - postgres
    networks:
      - backend
    restart: unless-stopped

  # Celery Beat (Scheduler) 
  beat:
    build:
      context: .
      target: development
    command: >
      celery -A app.workers.tasks.celery_app beat
      --loglevel=info
      --scheduler celery.beat:PersistentScheduler
    env_file:
      - backend/.env
    volumes:
      - .:/app
      - celery-beat-data:/var/lib/celery
    depends_on:
      - redis
    networks:
      - backend
    restart: unless-stopped

  #  Flower (Celery Monitor) 
  flower:
    build:
      context: .
      target: development
    command: >
      celery -A app.workers.tasks.celery_app flower
      --port=5555
    ports:
      - "5555:5555"
    env_file:
      - backend/.env
    depends_on:
      - redis
    networks:
      - backend
    restart: unless-stopped

  #  PostgreSQL 
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      POSTGRES_DB: roommate_finder
      PGDATA: /var/lib/postgresql/data/pgdata
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks:
      - backend
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d roommate_finder"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # Redis 
  redis:
    image: redis:7-alpine
    command: redis-server --appendonly yes --maxmemory 512mb --maxmemory-policy allkeys-lru
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    networks:
      - backend
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

networks:
  backend:
    driver: bridge

volumes:
  postgres-data:
  redis-data:
  celery-beat-data:
