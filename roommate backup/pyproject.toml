[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = [
    "--strict-markers",
    "--tb=short",
    "-v",
]
env = ["TESTING=true"]
markers = [
    "unit: Pure unit tests (no I/O)",
    "integration: Tests that require database or Redis",
    "security: Security-specific tests",
    "websocket: WebSocket tests",
]

[tool.coverage.run]
source = ["app"]
omit = [
    "*/tests/*",
    "*/migrations/*",
    "alembic/*",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
]

[tool.ruff]
line-length = 100
target-version = "py312"
select = ["E", "F", "I", "N", "UP", "B", "S", "A"]
ignore = ["S101", "B008"]

[tool.mypy]
python_version = "3.12"
strict = false
ignore_missing_imports = true
